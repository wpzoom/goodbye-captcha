<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light">
<title>{email-title}</title>
<style>
	.wpb-card a { color: #6a26c6; }
	@media only screen and (max-width: 480px) {
		.wpb-card { padding: 24px 18px 22px !important; }
		.wpb-tile { display: block !important; width: 100% !important; padding: 0 0 8px !important; box-sizing: border-box; }
	}
</style>
</head>
<body style="margin:0;padding:0;background:#f4f3f8;-webkit-font-smoothing:antialiased;-moz-osx-font-smoothing:grayscale;">

<div style="display:none;max-height:0;overflow:hidden;opacity:0;color:transparent;">{email-preheader}</div>

<table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0" style="background:#f4f3f8;">
	<tr>
		<td align="center" style="padding:32px 12px;">

			<table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0" style="max-width:600px;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;font-size:15px;line-height:1.55;color:#1f1d2b;">

				<tr>
					<td style="padding:0 4px 16px;">
						<table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0">
							<tr>
								<td style="vertical-align:middle;">
									<img src="{logo-url}" width="28" height="28" alt="" style="display:inline-block;vertical-align:middle;border:0;border-radius:6px;">
									<span style="display:inline-block;vertical-align:middle;margin-left:8px;font-size:16px;font-weight:700;color:#1f1d2b;">WPBruiser</span>
								</td>
								<td align="right" style="vertical-align:middle;font-size:13px;color:#6b6880;">
									<a href="{site-url}" style="color:#6b6880;text-decoration:none;">{site-name}</a>
								</td>
							</tr>
						</table>
					</td>
				</tr>

				<tr>
					<td class="wpb-card" style="background:#ffffff;border:1px solid #e7e5ef;border-radius:12px;padding:32px 32px 28px;">
						<h1 style="margin:0 0 20px;font-size:22px;line-height:1.3;font-weight:700;color:#1f1d2b;">{email-heading}</h1>
						{email-body-content}
					</td>
				</tr>

				<tr>
					<td style="padding:20px 4px 0;font-size:12px;line-height:1.6;color:#8a879b;text-align:center;">
						{footer-note}<br>
						<a href="{settings-url}" style="color:#6a26c6;text-decoration:none;">{footer-settings}</a>
						&nbsp;&middot;&nbsp;
						<a href="https://wordpress.org/support/plugin/goodbye-captcha/" style="color:#6a26c6;text-decoration:none;">{footer-help}</a>
					</td>
				</tr>

			</table>

		</td>
	</tr>
</table>

</body>
</html>
